<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Fondazione Slam Jam</title>
<link rel="icon" type="image/png" sizes="16x16" href="favicon-16x16.png">
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32x32.png">
<link rel="icon" type="image/png" sizes="48x48" href="favicon-48x48.png">
<link rel="icon" type="image/png" sizes="96x96" href="favicon-96x96.png">
<link rel="shortcut icon" href="favicon.ico">
<link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png">
<link rel="manifest" href="site.webmanifest">
<meta name="theme-color" content="#0a0a0a">
<link rel="preload" as="image" href="https://cdn.shopify.com/s/files/1/0576/7705/4136/files/slide-01.jpg?v=1784282511" fetchpriority="high">
<style>
  * { box-sizing: border-box; }

  @font-face {
    font-family: 'SJ Helvetica';
    src: url('https://cdn.shopify.com/s/files/1/0576/7705/4136/files/SJHelvetica-Roman.otf?v=1710498034') format('opentype');
    font-weight: normal;
    font-style: normal;
    font-display: swap;
  }

  html, body {
    margin: 0;
    padding: 0;
    height: 100%;
    background: #0a0a0a;
    overflow: hidden;
    font-family: 'SJ Helvetica', -apple-system, BlinkMacSystemFont, "Helvetica Neue", Arial, sans-serif;
  }

  /* Modalità senza slideshow: sfondo bianco fisso, logo e testo sempre neri */
  body.no-slideshow { background: #ffffff; }
  body.no-slideshow .stage { background: #ffffff; }

  .stage {
    position: relative;
    width: 100%;
    height: 100dvh;
    isolation: isolate;
    overflow: hidden;
  }

  .slide {
    position: absolute;
    inset: 0;
    background-size: cover;
    background-position: center;
    background-repeat: no-repeat;
    opacity: 0;
    transition: opacity 1.4s ease;
    will-change: opacity;
  }

  .slide.active { opacity: 1; z-index: 1; }

  /* ---------- LOGO ---------- */
  .logo-overlay {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    width: min(150px, 32vw);
    z-index: 5;
    pointer-events: none;
  }

  .logo-overlay > img {
    width: 100%;
    height: auto;
    display: block;
  }

  /* ---------- NEWSLETTER (in basso a destra, sopra il footer) ---------- */
  .newsletter {
    position: absolute;
    right: 28px;
    bottom: 72px;               /* sopra il footer, non copre "Privacy Policy" */
    width: min(280px, 86vw);
    padding: 14px 16px 10px;
    transform: translateY(8px);
    opacity: 0;
    visibility: hidden;
    pointer-events: none;
    transition: opacity .6s ease, transform .6s ease, visibility .6s;
    color: #ffffff;
    background: #000000;        /* nero pieno, non trasparente */
    font-family: 'SJ Helvetica', "Helvetica Neue", Helvetica, Arial, sans-serif;
    font-size: 11px;
    letter-spacing: 0.04em;
    text-transform: uppercase;
    z-index: 6;
  }

  .newsletter.show {
    opacity: 1;
    visibility: visible;
    pointer-events: auto;
    transform: translateY(0);
  }

  .nl-close {
    position: absolute;
    top: 4px;
    right: 8px;
    background: none;
    border: 0;
    padding: 6px;
    font: inherit;
    font-size: 18px;
    line-height: 1;
    color: inherit;
    cursor: pointer;
  }

  .nl-title { display: block; margin-bottom: 4px; padding-right: 18px; }

  .nl-row {
    display: flex;
    align-items: center;
    border-bottom: 1px solid currentColor;
  }

  .nl-row input[type="email"] {
    flex: 1;
    min-width: 0;
    background: transparent;
    border: 0;
    outline: 0;
    padding: 8px 0;
    color: inherit;
    font-family: inherit;
    font-size: 16px;            /* >=16px: evita lo zoom automatico di Safari su iPhone */
    letter-spacing: 0.02em;
    text-transform: none;
    border-radius: 0;
    -webkit-appearance: none;
    appearance: none;
  }

  .nl-row input[type="email"]::placeholder { color: inherit; opacity: .6; }

  .nl-submit {
    background: none;
    border: 0;
    padding: 6px 2px 6px 10px;
    font: inherit;
    font-size: 18px;
    color: inherit;
    cursor: pointer;
  }

  .nl-submit:disabled { opacity: .4; cursor: default; }

  .nl-note {
    margin: 8px 0 0;
    font-size: 9px;
    line-height: 1.35;
    letter-spacing: 0.02em;
    text-transform: none;
    opacity: .7;
  }

  .nl-note a { color: inherit; text-decoration: underline; }

  .nl-msg { margin: 6px 0 0; font-size: 10px; text-transform: none; letter-spacing: 0.02em; }
  .nl-msg:empty { display: none; }

  .nl-thanks {
    margin: 0;
    padding: 0 18px;
    display: flex;
    align-items: center;
    justify-content: center;
    text-align: center;
    min-height: 40px;
    line-height: 1.4;
  }

  .nl-thanks[hidden] { display: none; }

  /* Stato "thank you": il box diventa un contenitore flex e il testo
     sta esattamente al centro, in orizzontale e in verticale */
  .newsletter.is-thanks {
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 14px 16px;
  }

  .newsletter.is-thanks .nl-thanks {
    padding: 0;
    min-height: 0;
    width: 100%;
  }

  /* ---------- FOOTER ---------- */
  footer {
    position: absolute;
    left: 0;
    right: 0;
    bottom: 0;
    padding: 20px 28px;
    display: flex;
    justify-content: space-between;
    align-items: flex-end;
    gap: 24px;
    font-size: 13px;
    letter-spacing: 0.02em;
    color: #ffffff;
    text-align: left;
    z-index: 4;
    transition: color 0.6s ease;
  }

  footer.on-light, footer.on-light a { color: #0a0a0a; }

  footer .links div { line-height: 1.15; }

  footer a { color: #ffffff; text-decoration: none; }
  footer a:hover { text-decoration: underline; }

  footer .legal {
    margin: 0;
    font-size: 10px;
    line-height: 1.45;
    letter-spacing: 0.02em;
    text-align: right;
    opacity: .8;
  }

  @media (max-width: 640px) {
    footer { flex-direction: column; align-items: flex-start; gap: 10px; padding: 16px 20px; }
    footer .legal { text-align: left; }

    /* Su mobile il footer è più alto: popup a tutta larghezza, sopra il footer */
    .newsletter {
      left: 20px;
      right: 20px;
      width: auto;
      bottom: 108px;
    }
  }
</style>
</head>
<body id="pageBody">

  <div class="stage" id="stage">

    <div class="logo-overlay" id="logoOverlay">
      <img id="logoImg" src="https://cdn.shopify.com/s/files/1/0576/7705/4136/files/FONDAZIONE_web_black.png?v=1784283359" alt="Fondazione Slam Jam">
    </div>

    <!-- Popup newsletter: in basso a destra, appare dopo qualche secondo -->
    <div class="newsletter" id="newsletter" role="dialog" aria-label="Newsletter signup">
      <button class="nl-close" id="nlClose" type="button" aria-label="Close">×</button>
      <form id="nlForm" novalidate>
        <label class="nl-title" for="nlEmail">Subscribe to our newsletter</label>
        <div class="nl-row">
          <input type="email" id="nlEmail" name="email" placeholder="Your email" autocomplete="email" inputmode="email" required>
          <button type="submit" class="nl-submit" id="nlSubmit" aria-label="Subscribe">→</button>
        </div>
        <p class="nl-note">By subscribing you agree to our <a href="https://www.iubenda.com/privacy-policy/POLICY_ID" class="iubenda-nostyle iubenda-noiframe iubenda-embed" title="Privacy Policy">Privacy Policy</a>.</p>
        <p class="nl-msg" id="nlMsg" role="status" aria-live="polite"></p>
      </form>
      <p class="nl-thanks" id="nlThanks" role="status" aria-live="polite" hidden>Thank you.<br>You&rsquo;re now subscribed.</p>
    </div>

    <footer id="siteFooter">
      <div class="links">
        <div><a href="https://instagram.com/fondazioneslamjam" target="_blank" rel="noopener">@FONDAZIONESLAMJAM</a></div>
        <div><a href="mailto:info@fondazioneslamjam.org">INFO@FONDAZIONESLAMJAM.ORG</a></div>
      </div>
      <p class="legal">
        <a href="https://www.iubenda.com/privacy-policy/POLICY_ID" class="iubenda-nostyle iubenda-noiframe iubenda-embed" title="Privacy Policy">PRIVACY POLICY</a>
      </p>
    </footer>

  </div>

  <script>
    // ============================================================
    // CONFIGURAZIONE
    // ============================================================
    const SHOW_SLIDESHOW = true;          // false = pagina bianca fissa, senza foto
    const BREVO_FORM_URL = 'https://6653aa1f.sibforms.com/serve/MUIFAKJ53gaRg_ATkJT2MQqZJT00ResTPMbKXrA1bQ8McJY1pair_EbC95FyY9XmVghLiKo9dHgnHhFxSdQMrn2S0zvbwOciUNDwFfgxMI3duxYPURzAr7Tg1BYlOf1pjLG6e51v3VspGLGDzNVpmqilDd-OEhT0YmKfpxoGrRwXho9gXgyyPIPl4JBsG3G2MHR2HmkAu736eVbN'; // action del form Brevo (Share > Embed > HTML)
    const NEWSLETTER_DELAY = 3000;        // ms prima che compaia il popup
    const NEWSLETTER_HIDE_DAYS = 30;      // giorni in cui non riappare dopo chiusura/iscrizione

    const images = [
      "https://cdn.shopify.com/s/files/1/0576/7705/4136/files/slide-01.jpg?v=1784282511",
      "https://cdn.shopify.com/s/files/1/0576/7705/4136/files/slide-08.jpg?v=1784282511",
      "https://cdn.shopify.com/s/files/1/0576/7705/4136/files/slide-18.jpg?v=1784299778",
      "https://cdn.shopify.com/s/files/1/0576/7705/4136/files/slide-20.jpg?v=1784299778",
      "https://cdn.shopify.com/s/files/1/0576/7705/4136/files/slide-10.jpg?v=1784299777",
      "https://cdn.shopify.com/s/files/1/0576/7705/4136/files/slide-16.jpg?v=1784299778",
      "https://cdn.shopify.com/s/files/1/0576/7705/4136/files/slide-13.jpg?v=1784299778",
      "https://cdn.shopify.com/s/files/1/0576/7705/4136/files/slide-17.jpg?v=1784299778"
    ];

    // Fisher-Yates shuffle: ordine random ad ogni caricamento della pagina
    function shuffle(arr) {
      const a = arr.slice();
      for (let i = a.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [a[i], a[j]] = [a[j], a[i]];
      }
      return a;
    }

    const logoImg = document.getElementById('logoImg');
    const siteFooter = document.getElementById('siteFooter');
    const newsletter = document.getElementById('newsletter');
    const LOGO_WHITE = "https://cdn.shopify.com/s/files/1/0576/7705/4136/files/FONDAZIONE_web_white.png?v=1784283359";
    const LOGO_BLACK = "https://cdn.shopify.com/s/files/1/0576/7705/4136/files/FONDAZIONE_web_black.png?v=1784283359";

    // Applica il tema (chiaro/scuro) a logo e footer. Il popup newsletter resta sempre nero.
    function applyTheme(dark) {
      logoImg.src = dark ? LOGO_WHITE : LOGO_BLACK;
      siteFooter.classList.toggle('on-light', !dark);
    }

    if (!SHOW_SLIDESHOW) {
      document.getElementById('pageBody').classList.add('no-slideshow');
      applyTheme(false);
    } else {
      runSlideshow();
    }

    function runSlideshow() {
      const shuffledImages = shuffle(images);
      const stage = document.getElementById('stage');
      const slides = [];
      const isDarkBehind = new Array(shuffledImages.length).fill(false);

      shuffledImages.forEach((url, i) => {
        const div = document.createElement('div');
        div.className = 'slide' + (i === 0 ? ' active' : '');
        div.style.backgroundImage = `url('${url}')`;
        stage.insertBefore(div, stage.firstChild);
        slides.push(div);
      });

      // Luminosità SOLO nella zona dove sta il logo (crop reale in base allo schermo)
      function analyzeBrightness(url) {
        return new Promise((resolve) => {
          const img = new Image();
          img.crossOrigin = 'anonymous';
          img.onload = () => {
            try {
              const vw = window.innerWidth;
              const vh = window.innerHeight;
              const iw = img.naturalWidth;
              const ih = img.naturalHeight;
              const coverScale = Math.max(vw / iw, vh / ih);
              const logoScreenSize = Math.min(150, vw * 0.32) * 1.6;
              const sampleSizeInImg = logoScreenSize / coverScale;
              const cropX = Math.max(0, (iw - sampleSizeInImg) / 2);
              const cropY = Math.max(0, (ih - sampleSizeInImg) / 2);
              const cropW = Math.min(sampleSizeInImg, iw);
              const cropH = Math.min(sampleSizeInImg, ih);

              const size = 30;
              const canvas = document.createElement('canvas');
              canvas.width = size;
              canvas.height = size;
              const ctx = canvas.getContext('2d');
              ctx.drawImage(img, cropX, cropY, cropW, cropH, 0, 0, size, size);

              const data = ctx.getImageData(0, 0, size, size).data;
              let total = 0;
              for (let p = 0; p < data.length; p += 4) {
                total += 0.299 * data[p] + 0.587 * data[p + 1] + 0.114 * data[p + 2];
              }
              resolve(total / (data.length / 4) < 130); // true = zona scura
            } catch (e) {
              resolve(false);
            }
          };
          img.onerror = () => resolve(false);
          img.src = url;
        });
      }

      Promise.all(shuffledImages.map(analyzeBrightness)).then((results) => {
        results.forEach((dark, i) => { isDarkBehind[i] = dark; });
        applyTheme(isDarkBehind[0]);
      });

      shuffledImages.forEach(url => { const im = new Image(); im.src = url; });

      let current = 0;
      const INTERVAL = 5000;

      setInterval(() => {
        const next = (current + 1) % slides.length;
        slides[next].classList.add('active');
        slides[current].classList.remove('active');
        current = next;
        applyTheme(isDarkBehind[current]);
      }, INTERVAL);
    }

    // ============================================================
    // NEWSLETTER (Brevo)
    // ============================================================
    (function initNewsletter() {
      const STORAGE_KEY = 'sj_newsletter_hidden_until';
      const SUBSCRIBED_KEY = 'sj_newsletter_subscribed';
      const form = document.getElementById('nlForm');
      const emailInput = document.getElementById('nlEmail');
      const submitBtn = document.getElementById('nlSubmit');
      const msg = document.getElementById('nlMsg');
      const closeBtn = document.getElementById('nlClose');
      const thanks = document.getElementById('nlThanks');

      function hiddenUntil() {
        try { return parseInt(localStorage.getItem(STORAGE_KEY) || '0', 10); } catch (e) { return 0; }
      }
      function snooze() {
        try { localStorage.setItem(STORAGE_KEY, String(Date.now() + NEWSLETTER_HIDE_DAYS * 864e5)); } catch (e) {}
      }

      function isSubscribed() {
        try { return localStorage.getItem(SUBSCRIBED_KEY) === '1'; } catch (e) { return false; }
      }
      function markSubscribed() {
        try { localStorage.setItem(SUBSCRIBED_KEY, '1'); } catch (e) {}
      }

      // Chi arriva da un link nelle nostre email (?subscribed=1) è già iscritto:
      // non gli mostriamo più il popup, anche su un browser/dispositivo nuovo.
      const params = new URLSearchParams(window.location.search);
      if (params.get('subscribed') === '1') {
        markSubscribed();
        if (window.history && history.replaceState) {
          history.replaceState(null, '', window.location.pathname + window.location.hash);
        }
      }

      if (!isSubscribed() && Date.now() > hiddenUntil()) {
        setTimeout(() => newsletter.classList.add('show'), NEWSLETTER_DELAY);
      }

      closeBtn.addEventListener('click', () => {
        newsletter.classList.remove('show');
        snooze();
      });

      form.addEventListener('submit', async (e) => {
        e.preventDefault();
        const email = emailInput.value.trim();

        if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) { msg.textContent = 'Please enter a valid email.'; return; }

        submitBtn.disabled = true;
        msg.textContent = '';

        // Sostituisco subito il form con il "Thank you" (senza aspettare la risposta),
        // mantenendo l'altezza del popup per evitare scatti.
        newsletter.style.minHeight = newsletter.offsetHeight + 'px';
        form.hidden = true;
        thanks.hidden = false;
        newsletter.classList.add('is-thanks');

        try {
          // Brevo: invio come un normale form. La risposta è "opaca" (no-cors),
          // quindi qui si vedono solo errori di rete, non rifiuti lato Brevo.
          const fd = new FormData();
          fd.append('EMAIL', email);
          fd.append('email_address_check', ''); // honeypot anti-spam: deve restare vuoto
          fd.append('locale', 'en');
          fd.append('html_type', 'simple');
          await fetch(BREVO_FORM_URL, { method: 'POST', body: fd, mode: 'no-cors' });

          form.reset();
          markSubscribed();
          // dopo qualche secondo il popup scompare
          setTimeout(() => newsletter.classList.remove('show'), 3500);
        } catch (err) {
          // errore di rete: ripristino il form con un messaggio
          thanks.hidden = true;
          form.hidden = false;
          newsletter.classList.remove('is-thanks');
          newsletter.style.minHeight = '';
          msg.textContent = 'Something went wrong. Please try again.';
        } finally {
          submitBtn.disabled = false;
        }
      });
    })();
  </script>

</body>
